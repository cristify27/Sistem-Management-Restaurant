<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Coșul tău</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h1 class="mb-4">Coșul tău de cumpărături</h1>

  <div th:if="${produseCos.empty}" class="alert alert-info">
    Coșul tău este gol. <a href="/" class="alert-link">Întoarce-te la meniu</a>.
  </div>

  <div th:unless="${produseCos.empty}">
    <ul class="list-group mb-4">
      <li class="list-group-item d-flex justify-content-between align-items-center" th:each="produs : ${produseCos}">
        <span th:text="${produs.denumire}">Nume Produs</span>
        <span class="badge bg-success rounded-pill" th:text="${produs.pret} + ' RON'">Pret</span>
      </li>
    </ul>

    <h4 class="text-end mb-4">Total: <strong th:text="${totalPlata} + ' RON'">0</strong></h4>

    <div class="card p-3 mb-4 shadow-sm border-0">
      <h5 class="fw-bold mb-3">Alege metoda de plată:</h5>

      <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="metodaPlataOptiune" id="plataCash" value="Cash" onclick="arataButonComanda()">
        <label class="form-check-label" for="plataCash">
          CASH
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="metodaPlataOptiune" id="plataCard" value="Card" onclick="arataButonComanda()">
        <label class="form-check-label" for="plataCard">
          CARD
        </label>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <a href="/" class="btn btn-outline-secondary">Mai adaugă produse</a>

      <form th:action="@{/plaseaza-comanda}" method="post" id="formComanda">
        <input type="hidden" name="metodaPlata" id="metodaPlataAscuns">

        <button type="submit" class="btn btn-success btn-lg d-none" id="btnPlaseazaComanda">
          Plasează Comanda
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  function arataButonComanda() {
    const optiuni = document.getElementsByName('metodaPlataOptiune');
    let valoareSelectata = "";

    for (const optiune of optiuni) {
      if (optiune.checked) {
        valoareSelectata = optiune.value;
        break;
      }
    }

    if (valoareSelectata !== "") {
      document.getElementById('metodaPlataAscuns').value = valoareSelectata;

      document.getElementById('btnPlaseazaComanda').classList.remove('d-none');
    }
  }
</script>

</body>
</html>
