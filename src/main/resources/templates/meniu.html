<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meniu Restaurant Magic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .buton-x-rosu {
            background-color: red;
            color: white;
            width: 32px;
            height: 32px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }
        .buton-x-rosu:hover {
            background-color: darkred;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-5">Meniul Nostru</h1>

    <div class="text-end mb-3">
        <a href="/cos" class="btn btn-warning">🛒 Vezi Coșul</a>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="produs : ${listaProduse}" th:if="${produs.esteDisponibil}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <span class="badge bg-secondary mb-2" th:text="${produs.categorie}">Categorie</span>

                    <h5 class="card-title fw-bold" th:text="${produs.denumire}">Nume Produs</h5>
                    <p class="card-text text-success fs-5" th:text="${produs.pret + ' RON'}">Pret</p>

                    <div class="d-flex justify-content-between mt-3">
                        <form th:action="@{/adauga-cos/{id}(id=${produs.id})}" method="post" class="m-0 p-0">
                            <button type="submit" class="btn btn-primary btn-sm">Adaugă în coș</button>
                        </form>

                        <button class="btn btn-outline-info btn-sm"
                                data-bs-toggle="modal"
                                th:data-bs-target="'#modalProdus' + ${produs.id}">Detalii</button>
                    </div>
                </div>
            </div>

            <div class="modal fade" th:id="'modalProdus' + ${produs.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" th:text="'Detalii: ' + ${produs.denumire}">Detalii</h5>
                            <button type="button" class="buton-x-rosu" data-bs-dismiss="modal">X</button>
                        </div>
                        <div class="modal-body">
                            <p><strong>Ingrediente:</strong> <span th:text="${produs.ingrediente}"></span></p>

                            <div th:if="${produs.estePicant}" class="alert alert-danger p-2 mt-2">
                                 <strong>Atenție:</strong> Acest produs este picant!
                            </div>
                            <div th:if="${produs.esteVegetarian}" class="alert alert-success p-2 mt-2">
                                <strong>Informație:</strong> Produs vegetarian.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
