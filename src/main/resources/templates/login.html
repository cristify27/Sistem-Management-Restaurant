<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .btn-admin:hover {
        background-color: #0dc5fd;
        color: white;
        border-color: #0dc5fd;
    }
    .btn-adauga {
        background-color: #0dc5fd;
        color: white;
        border-color: #0dc5fd;
    }
    /* Am transformat clasa într-un stil de buton secundar de contur, fără lățime fixă */
    .Inapoi-text {
        color: #0dc5fd;
        border: 2px solid #0dc5fd;
        background-color: transparent;
        font-weight: 500;
        transition: all 0.3s ease;
    }
    .Inapoi-text:hover {
        background-color: #c10000;
        color: white;
    }
</style>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h3 text-center mb-4">Log in</h1>

                    <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Introduceți username-ul" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Parolă</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Introduceți parola" required>
                        </div>
                        <button type="submit" class="btn btn-adauga w-100">Autentificare</button>
                    </form>

                    <div class="mt-3">
                        <a href="/" class="btn Inapoi-text w-100">Înapoi la meniu</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
