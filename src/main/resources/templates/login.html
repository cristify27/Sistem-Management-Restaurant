<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h3 text-center mb-4">Log in</h1>

                    <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="text" class="form-control" id="email" name="email" placeholder="Introduceți email-ul" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Parolă</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Introduceți parola" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Autentificare</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/" class="text-decoration-none">Înapoi la meniu</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
