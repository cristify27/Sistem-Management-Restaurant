<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adaugă Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4 fw-bold">Adaugă Membru Personal</h2>

                    <div th:if="${personalAdaugat}" class="alert alert-success" th:text="${personalAdaugat}"></div>

                    <form th:action="@{/add-personal}" method="post">

                        <div class="mb-3">
                            <label for="email" class="form-label">Adresă Email (contact)</label>
                            <input type="email" id="email" name="email" class="form-control" required placeholder="Ex: ion@restaurant.com">
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Username (folosit la login)</label>
                            <input type="text" id="username" name="username" class="form-control" required placeholder="Ex: ionut99">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Parolă</label>
                            <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
                        </div>

                        <p class="text-muted small mb-4">Personalul adăugat va avea rolul de <strong>Ospătar</strong> și va putea gestiona comenzile.</p>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success w-100">Salvează în BD</button>
                            <a href="/" class="btn btn-outline-secondary w-100">Anulează</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
